# Included in each location (nginx does not inherit add_header into a location
# that sets its own). The same headers as render.yaml.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src 'self' blob: data: https://api.anthropic.com; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
